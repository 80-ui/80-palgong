<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | 80 Palgong</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">80 / Palgong</a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>


    <main class="page">

        <h1 class="page-title">CONTACT</h1>

        <div class="contact-content">

            <p>
                PV 작업 문의나 커미션 관련 문의는<br>
                아래 폼을 이용해주세요! 💚
            </p>

            <form
                class="contact-form"
                action="https://formspree.io/f/xppzyzly"
                method="POST"
            >

                <label for="name">NAME</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="이름 또는 닉네임"
                    required
                >


                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="답변 받을 이메일"
                    required
                >


                <label for="subject">SUBJECT</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="문의 제목"
                    required
                >


                <label for="message">MESSAGE</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="작업 내용이나 문의사항을 자유롭게 적어주세요!"
                    required
                ></textarea>


                <button type="submit">
                    SEND MESSAGE →
                </button>

            </form>

        </div>

    </main>


    <img
        src="assets/character.png"
        class="floating-character"
        alt="Palgong character"
    >

</body>

</html>
