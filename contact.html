<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | 80 Palgong</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">80 / Palgong</a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>


    <main class="page">

        <h1 class="page-title">의뢰 신청서</h1>

        <div class="contact-content">

            <p>
                PV 작업 의뢰를 원하신다면<br>
                아래 신청서를 작성해주세요! 💚
            </p>


            <form
                class="contact-form"
                action="https://formspree.io/f/xppzyzly"
                method="POST"
            >

                <!-- 이름 / 닉네임 -->
                <label for="name">이름 / 닉네임</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="이름 또는 닉네임을 입력해주세요"
                    required
                >


                <!-- 이메일 -->
                <label for="email">이메일</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="답변 받을 이메일을 입력해주세요"
                    required
                >


                <!-- 작업 종류 -->
                <label for="work-type">작업 종류</label>

                <select
                    id="work-type"
                    name="work_type"
                    required
                >
                    <option value="" disabled selected>
                        작업 종류를 선택해주세요
                    </option>

                    <option value="PV">PV</option>
                    <option value="MV">MV</option>
                    <option value="영상 편집">영상 편집</option>
                    <option value="기타">기타</option>
                </select>


                <!-- 예산 -->
                <label for="budget">예산</label>

                <input
                    type="text"
                    id="budget"
                    name="budget"
                    placeholder="예: 50,000원 / 협의"
                    required
                >


                <!-- 희망 마감일 -->
                <label for="deadline">희망 마감일</label>

                <input
                    type="date"
                    id="deadline"
                    name="deadline"
                    required
                >


                <!-- 참고 영상 / 링크 -->
                <label for="reference">참고 영상 / 링크</label>

                <input
                    type="url"
                    id="reference"
                    name="reference"
                    placeholder="YouTube, Drive 등의 링크"
                >


                <!-- 작업 내용 -->
                <label for="message">작업 내용</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="원하시는 작업 내용을 자세하게 적어주세요."
                    required
                ></textarea>


                <!-- 제출 -->
                <button type="submit">
                    제출 →
                </button>

            </form>

        </div>

    </main>


    <img
        src="assets/character.png"
        class="floating-character"
        alt="Palgong character"
    >

</body>

</html>
